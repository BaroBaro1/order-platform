<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عرض المنتج</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f4f9;
  direction:rtl;
  color:#222;
}

/* ===== NAVBAR ===== */

.navbar{
  background:white;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 30px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.right-side,
.left-side{
  display:flex;
  align-items:center;
  gap:12px;
}

.store-img{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #eee;
}

#welcomeText{
  font-weight:bold;
}

.logo{
  font-size:24px;
  font-weight:bold;
  color:#7c3aed;
}

.logout{
  text-decoration:none;
  color:#ff3366;
  font-weight:bold;
}

.notifications{
  text-decoration:none;
  font-size:20px;
}

.notification-wrapper{
  position:relative;
}

.badge{
  position:absolute;
  top:-5px;
  right:-5px;
  background:red;
  color:white;
  font-size:11px;
  width:18px;
  height:18px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ===== LAYOUT ===== */

.layout{
  display:flex;
}

/* ===== SIDEBAR ===== */

.sidebar{
  width:240px;
  background:white;
  min-height:100vh;
  padding-top:20px;
  border-left:1px solid #eee;
}

.sidebar a{
  display:block;
  padding:14px 20px;
  margin:6px 12px;
  border-radius:12px;
  text-decoration:none;
  color:#333;
  font-weight:600;
  transition:.2s;
}

.sidebar a:hover{
  background:#f3e8ff;
  color:#7c3aed;
}

/* ===== MAIN ===== */

.main{
  flex:1;
  padding:30px;
}

/* ===== PRODUCT CARD ===== */

.product-card{
  max-width:900px;
  margin:auto;
  background:white;
  border-radius:20px;
  padding:30px;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

/* ===== HEADER ===== */

.product-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:25px;
  flex-wrap:wrap;
}

.product-img{
  width:260px;
  height:260px;
  object-fit:cover;
  border-radius:18px;
  border:1px solid #eee;
  background:#fafafa;
}

/* ===== INFO ===== */

.product-title{
  font-size:30px;
  margin-bottom:10px;
}

.price-box{
  display:inline-block;
  background:#f3e8ff;
  color:#7c3aed;
  padding:10px 18px;
  border-radius:12px;
  font-weight:bold;
  margin-top:10px;
}

/* ===== FEATURES ===== */

.features-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
  margin-top:15px;
}

.feature-item{
  background:#faf7ff;
  border:1px solid #eee;
  border-radius:12px;
  padding:12px;
}

.feature-item b{
  color:#7c3aed;
}

/* ===== FORM ===== */

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}

input,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
  transition:.2s;
}

input:focus,
textarea:focus{
  border-color:#7c3aed;
  outline:none;
  box-shadow:0 0 0 3px rgba(124,58,237,.1);
}

textarea{
  min-height:120px;
  resize:vertical;
}

/* ===== BUTTONS ===== */

.buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:20px;
}

button{
  border:none;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  transition:.2s;
}

.edit-btn{
  background:#7c3aed;
  color:white;
}

.save-btn{
  background:#22c55e;
  color:white;
}

.cancel-btn{
  background:#ef4444;
  color:white;
}

.add-feature-btn{
  background:#2563eb;
  color:white;
}

.delete-feature-btn{
  background:#ef4444;
  color:white;
  margin-top:8px;
}

/* ===== FEATURE EDIT ===== */

.feature-row{
  border:1px solid #eee;
  padding:15px;
  border-radius:12px;
  margin-top:12px;
  background:#fafafa;
}

/* ===== STATUS ===== */

#status{
  margin-top:20px;
  font-weight:bold;
  color:#22c55e;
}

/* ===== FOOTER ===== */

footer{
  background:#222;
  color:white;
  text-align:center;
  padding:20px;
  margin-top:40px;
}

footer a{
  color:#ffd000;
  text-decoration:none;
  margin:0 10px;
}

/* ===== MOBILE ===== */

@media(max-width:768px){

  .layout{
    flex-direction:column;
  }

  .sidebar{
    width:100%;
    min-height:auto;
    display:flex;
    overflow:auto;
    padding:10px;
  }

  .sidebar a{
    white-space:nowrap;
  }

  .product-header{
    flex-direction:column;
    text-align:center;
  }

  .product-img{
    width:100%;
    max-width:300px;
    height:auto;
  }

  .main{
    padding:15px;
  }

}

</style>
</head>

<body>

<!-- ===== NAVBAR ===== -->

<div class="navbar">

  <div class="right-side">
    <img id="storeImg" src="https://via.placeholder.com/45" class="store-img">
    <span id="welcomeText">مرحبًا، التاجر</span>
  </div>

  <div class="left-side">

    <div class="notification-wrapper">
      <a class="notifications" href="notifications.html">🔔</a>
      <span id="notifBadge" class="badge" style="display:none;">0</span>
    </div>

    <a class="logout" href="login.html">تسجيل الخروج</a>

    <div class="logo">Baro</div>

  </div>

</div>

<div class="layout">

<!-- ===== SIDEBAR ===== -->

<div class="sidebar">

  <a href="dashboard.html">🏠 لوحة التحكم</a>
  <a href="allorders.html">🛒 الطلبات</a>
  <a href="settings.html">⚙️ الإعدادات</a>
  <a href="addProduct.html">➕ إضافة منتج</a>

</div>

<!-- ===== MAIN ===== -->

<div class="main">

<div class="product-card">

<div class="product-header">

  <div>

    <h1 id="v_name" class="product-title"></h1>

    <p>
      <b>الصنف:</b>
      <span id="v_category"></span>
    </p>

    <div class="price-box">
      💰 <span id="v_price"></span> دج
    </div>

    <div class="buttons">
      <button class="edit-btn" onclick="enableEdit()">
        ✏️ تعديل المنتج
      </button>
    </div>

  </div>

  <img id="productImage" class="product-img" src="">

</div>

<!-- ===== VIEW MODE ===== -->

<div id="viewMode">

  <h3>📝 وصف المنتج</h3>

  <p id="v_desc"></p>

  <h3 style="margin-top:25px;">✨ الميزات</h3>

  <div id="v_features" class="features-grid"></div>

</div>

<!-- ===== EDIT MODE ===== -->

<div id="editMode" style="display:none;">

  <div class="form-group">
    <label>اسم المنتج</label>
    <input id="e_name">
  </div>

  <div class="form-group">
    <label>الصنف</label>
    <input id="e_category">
  </div>

  <div class="form-group">
    <label>السعر</label>
    <input id="e_price">
  </div>

  <div class="form-group">
    <label>الوصف</label>
    <textarea id="e_desc"></textarea>
  </div>

  <h3>✨ الميزات</h3>

  <div id="e_features"></div>

  <button
    type="button"
    class="add-feature-btn"
    onclick="addFeatureField()"
  >
    ➕ إضافة ميزة
  </button>

  <div class="buttons">

    <button class="save-btn" onclick="saveChanges()">
      💾 حفظ التغييرات
    </button>

    <button class="cancel-btn" onclick="disableEdit()">
      ❌ إلغاء
    </button>

  </div>

</div>

<p id="status"></p>

</div>

</div>

</div>

<footer>
  <p>© 2026 Baro - جميع الحقوق محفوظة</p>
</footer>

<script>

const token = localStorage.getItem("token");
const merchantId = localStorage.getItem("merchantId");

if(!token || !merchantId){
  alert("الرجاء تسجيل الدخول أولاً");
  window.location = "login.html";
}

const params = new URLSearchParams(window.location.search);
const productId = params.get("productId");

if(!productId){
  alert("لا يوجد منتج");
  window.location = "dashboard.html";
}

/* ===== بيانات التاجر ===== */

fetch(`https://order-platform-2.onrender.com/merchants/${merchantId}`,{
  headers:{
    "Authorization":`Bearer ${token}`
  }
})
.then(r=>r.json())
.then(merchant=>{

  document.getElementById("welcomeText").textContent =
    "مرحبًا، " + (merchant.name || "التاجر");

  if(merchant.storeImage){
    document.getElementById("storeImg").src =
      "https://order-platform-2.onrender.com" + merchant.storeImage;
  }

});

/* ===== وضع التعديل ===== */

function enableEdit(){
  document.getElementById("viewMode").style.display = "none";
  document.getElementById("editMode").style.display = "block";
}

function disableEdit(){
  document.getElementById("viewMode").style.display = "block";
  document.getElementById("editMode").style.display = "none";
}

/* ===== جلب المنتج ===== */

fetch(`https://order-platform-2.onrender.com/merchants/${merchantId}/products/${productId}`,{
  headers:{
    "Authorization":`Bearer ${token}`
  }
})
.then(r=>r.json())
.then(data=>{

  const p = data.product || data;

  document.getElementById("productImage").src =
    "https://order-platform-2.onrender.com" + (p.image || "");

  document.getElementById("v_name").textContent = p.name;
  document.getElementById("v_category").textContent = p.category || "—";
  document.getElementById("v_price").textContent = p.price;
  document.getElementById("v_desc").textContent = p.description || "";

  document.getElementById("e_name").value = p.name;
  document.getElementById("e_category").value = p.category || "";
  document.getElementById("e_price").value = p.price;
  document.getElementById("e_desc").value = p.description || "";

  /* ===== عرض الميزات ===== */

  const vF = document.getElementById("v_features");
  vF.innerHTML = "";

  (p.features || []).forEach(f=>{

    vF.innerHTML += `
      <div class="feature-item">
        <b>${f.name}</b>
        <p>${f.values.join(" ، ")}</p>
      </div>
    `;

  });

  /* ===== وضع التعديل ===== */

  const eF = document.getElementById("e_features");
  eF.innerHTML = "";

  (p.features || []).forEach(f=>{

    addFeatureField(
      f.name,
      f.values.join(", ")
    );

  });

});

/* ===== إضافة ميزة ===== */

function addFeatureField(name="", values=""){

  const container =
    document.getElementById("e_features");

  const div = document.createElement("div");

  div.className = "feature-row";

  div.innerHTML = `

    <input
      class="f_name"
      placeholder="اسم الميزة"
      value="${name}"
    >

    <input
      class="f_values"
      placeholder="القيم مفصولة بفاصلة"
      value="${values}"
    >

    <button
      type="button"
      class="delete-feature-btn"
      onclick="this.parentElement.remove()"
    >
      🗑️ حذف
    </button>

  `;

  container.appendChild(div);

}

/* ===== حفظ التعديلات ===== */

function saveChanges(){

  const featureRows =
    document.querySelectorAll(".feature-row");

  let features = [];

  featureRows.forEach(row=>{

    const name =
      row.querySelector(".f_name").value.trim();

    const values =
      row.querySelector(".f_values").value
      .split(",")
      .map(v=>v.trim())
      .filter(v=>v !== "");

    if(name && values.length > 0){

      features.push({
        name:name,
        values:values
      });

    }

  });

  const body = {

    name:
      document.getElementById("e_name").value,

    category:
      document.getElementById("e_category").value,

    price:
      document.getElementById("e_price").value,

    description:
      document.getElementById("e_desc").value,

    features:features

  };

  fetch(`https://order-platform-2.onrender.com/merchants/${merchantId}/products/${productId}`,{

    method:"PUT",

    headers:{
      "Content-Type":"application/json",
      "Authorization":`Bearer ${token}`
    },

    body:JSON.stringify(body)

  })

  .then(r=>r.json())

  .then(data=>{

    document.getElementById("status").textContent =
      "تم حفظ التعديلات بنجاح ✅";

    setTimeout(()=>{
      location.reload();
    },1000);

  })

  .catch(err=>{

    console.error(err);

    alert("حدث خطأ أثناء الحفظ");

  });

}

/* ===== الإشعارات ===== */

fetch(`https://order-platform-2.onrender.com/merchants/${merchantId}/notifications`,{
  headers:{
    "Authorization":`Bearer ${token}`
  }
})
.then(r=>r.json())
.then(notifs=>{

  const unread =
    notifs.filter(n=>!n.isRead).length;

  const badge =
    document.getElementById("notifBadge");

  if(unread > 0){

    badge.style.display = "flex";
    badge.textContent = unread;

  }

});

</script>

</body>
</html>
