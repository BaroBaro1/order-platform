<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عرض المنتج | Baro</title>

<style>

:root{
  --primary:#7c3aed;
  --primary-light:#a855f7;
  --bg:#f5f3ff;
  --card:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
  --border:#e5e7eb;
  --success:#16a34a;
  --danger:#dc2626;
  --shadow:0 10px 30px rgba(124,58,237,.10);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  direction:rtl;
  background:linear-gradient(to bottom,#f8f5ff,#f3f4f6);
  color:var(--text);
}

/* ================= HEADER ================= */

.navbar{
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(12px);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 30px;
  border-bottom:1px solid rgba(0,0,0,.05);
  position:sticky;
  top:0;
  z-index:100;
}

.right-side,
.left-side{
  display:flex;
  align-items:center;
  gap:14px;
}

.store-img{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #ede9fe;
  background:#fff;
}

#welcomeText{
  font-weight:bold;
}

.logo{
  font-size:24px;
  font-weight:bold;
  color:var(--primary);
}

.logout{
  text-decoration:none;
  color:#ef4444;
  font-weight:bold;
}

.notifications{
  text-decoration:none;
  font-size:22px;
}

.notification-wrapper{
  position:relative;
}

.badge{
  position:absolute;
  top:-6px;
  right:-8px;
  background:red;
  color:white;
  width:18px;
  height:18px;
  border-radius:50%;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

/* ================= LAYOUT ================= */

.layout{
  display:flex;
}

/* ================= SIDEBAR ================= */

.sidebar{
  width:240px;
  min-height:100vh;
  background:linear-gradient(180deg,#6d28d9,#7c3aed);
  padding:25px 15px;
  position:sticky;
  top:78px;
}

.sidebar a{
  display:flex;
  align-items:center;
  gap:10px;
  color:white;
  text-decoration:none;
  padding:14px;
  margin-bottom:10px;
  border-radius:12px;
  transition:.25s;
}

.sidebar a:hover{
  background:rgba(255,255,255,.15);
}

.sidebar a.active{
  background:white;
  color:var(--primary);
  font-weight:bold;
}

/* ================= MAIN ================= */

.main{
  flex:1;
  padding:30px;
}

/* ================= CARD ================= */

.product-card{
  max-width:1100px;
  margin:auto;
  background:rgba(255,255,255,.92);
  border-radius:24px;
  padding:30px;
  box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,.4);
}

/* ================= HEADER PRODUCT ================= */

.product-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:25px;
  flex-wrap:wrap;
}

.product-image-box{
  flex:1;
  min-width:280px;
  text-align:center;
}

.product-img{
  width:100%;
  max-width:380px;
  height:380px;
  object-fit:cover;
  border-radius:24px;
  border:1px solid #eee;
  background:white;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.product-info-top{
  flex:1;
  min-width:280px;
}

.product-title{
  font-size:34px;
  font-weight:bold;
  margin-bottom:15px;
}

.price-box{
  display:inline-block;
  background:#ede9fe;
  color:var(--primary);
  padding:10px 18px;
  border-radius:14px;
  font-size:24px;
  font-weight:bold;
  margin-bottom:15px;
}

.category-box{
  display:inline-block;
  background:#f3f4f6;
  padding:8px 14px;
  border-radius:10px;
  color:#555;
  margin-bottom:20px;
}

/* ================= ACTIONS ================= */

.actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:20px;
}

button{
  border:none;
  cursor:pointer;
  border-radius:12px;
  padding:12px 18px;
  font-weight:bold;
  transition:.25s;
}

.edit-btn{
  background:var(--primary);
  color:white;
}

.edit-btn:hover{
  background:#6d28d9;
}

.save-btn{
  background:var(--success);
  color:white;
}

.cancel-btn{
  background:#ef4444;
  color:white;
}

.delete-feature{
  background:#ef4444;
  color:white;
  width:100%;
  margin-top:8px;
}

.add-feature{
  background:#2563eb;
  color:white;
  width:100%;
}

/* ================= DESCRIPTION ================= */

.section{
  margin-top:30px;
}

.section h3{
  margin-bottom:15px;
  color:var(--primary);
}

.description-box{
  line-height:1.9;
  color:#444;
  background:#fafafa;
  border:1px solid #eee;
  padding:18px;
  border-radius:14px;
}

/* ================= FEATURES ================= */

.features-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.feature-card{
  background:#faf5ff;
  border:1px solid #ede9fe;
  padding:16px;
  border-radius:16px;
}

.feature-card h4{
  color:var(--primary);
  margin-bottom:10px;
}

.feature-values{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.feature-values span{
  background:white;
  border:1px solid #ddd;
  padding:6px 10px;
  border-radius:999px;
  font-size:14px;
}

/* ================= EDIT MODE ================= */

.edit-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.input-group{
  margin-bottom:18px;
}

.input-group label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
}

input,
textarea{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #ddd;
  outline:none;
  background:#fafafa;
}

input:focus,
textarea:focus{
  border-color:var(--primary);
  background:white;
}

textarea{
  min-height:120px;
  resize:vertical;
}

.feature-row{
  background:#fafafa;
  border:1px solid #e5e7eb;
  padding:15px;
  border-radius:16px;
  margin-bottom:15px;
}

/* ================= STATUS ================= */

#status{
  margin-top:20px;
  font-weight:bold;
}

/* ================= FOOTER ================= */

footer{
  margin-top:50px;
  background:#111827;
  color:white;
  text-align:center;
  padding:25px;
}

footer a{
  color:#c4b5fd;
  text-decoration:none;
  margin:0 10px;
}

/* ================= MOBILE ================= */

@media(max-width:900px){

  .layout{
    flex-direction:column;
  }

  .sidebar{
    width:100%;
    min-height:auto;
    position:relative;
    top:0;
    display:flex;
    overflow:auto;
  }

  .sidebar a{
    white-space:nowrap;
  }

  .edit-grid{
    grid-template-columns:1fr;
  }

  .product-title{
    font-size:28px;
  }

}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<div class="navbar">

  <div class="right-side">
    <img id="storeImg"
         src="https://via.placeholder.com/100"
         class="store-img">

    <span id="welcomeText">مرحبًا، التاجر</span>
  </div>

  <div class="left-side">

    <div class="notification-wrapper">
      <a class="notifications" href="notifications.html">🔔</a>
      <span id="notifBadge"
            class="badge"
            style="display:none;">0</span>
    </div>

    <a class="logout" href="login.html">
      تسجيل الخروج
    </a>

    <div class="logo">Baro</div>

  </div>

</div>

<!-- ================= LAYOUT ================= -->

<div class="layout">

  <!-- ================= SIDEBAR ================= -->

  <div class="sidebar">

    <a href="dashboard.html">
      🏠 لوحة التحكم
    </a>

    <a href="allorders.html">
      🛒 الطلبات
    </a>

    <a href="settings.html">
      ⚙️ الإعدادات
    </a>

    <a href="addProduct.html">
      ➕ إضافة منتج
    </a>

  </div>

  <!-- ================= MAIN ================= -->

  <div class="main">

    <div class="product-card">

      <!-- VIEW MODE -->

      <div id="viewMode">

        <div class="product-header">

          <div class="product-image-box">
            <img id="productImage"
                 class="product-img"
                 src="https://via.placeholder.com/400">
          </div>

          <div class="product-info-top">

            <div class="category-box">
              <span id="v_category">—</span>
            </div>

            <h1 id="v_name"
                class="product-title"></h1>

            <div class="price-box">
              <span id="v_price"></span> دج
            </div>

            <div class="actions">

              <button class="edit-btn"
                      onclick="enableEdit()">
                ✏️ تعديل المنتج
              </button>

            </div>

          </div>

        </div>

        <!-- DESCRIPTION -->

        <div class="section">

          <h3>📝 وصف المنتج</h3>

          <div class="description-box"
               id="v_desc">
          </div>

        </div>

        <!-- FEATURES -->

        <div class="section">

          <h3>✨ الميزات</h3>

          <div id="v_features"
               class="features-grid">
          </div>

        </div>

      </div>

      <!-- EDIT MODE -->

      <div id="editMode"
           style="display:none;">

        <div class="edit-grid">

          <div>

            <div class="input-group">
              <label>اسم المنتج</label>
              <input id="e_name">
            </div>

            <div class="input-group">
              <label>الصنف</label>
              <input id="e_category">
            </div>

            <div class="input-group">
              <label>السعر</label>
              <input id="e_price" type="number">
            </div>

          </div>

          <div>

            <div class="input-group">
              <label>وصف المنتج</label>
              <textarea id="e_desc"></textarea>
            </div>

          </div>

        </div>

        <!-- FEATURES -->

        <div class="section">

          <h3>⚡ ميزات المنتج</h3>

          <div id="e_features"></div>

          <button type="button"
                  class="add-feature"
                  onclick="addFeatureField()">
            ➕ إضافة ميزة
          </button>

        </div>

        <!-- ACTIONS -->

        <div class="actions">

          <button class="save-btn"
                  onclick="saveChanges()">
            💾 حفظ التعديلات
          </button>

          <button class="cancel-btn"
                  onclick="disableEdit()">
            إلغاء
          </button>

        </div>

        <p id="status"></p>

      </div>

    </div>

  </div>

</div>

<!-- ================= FOOTER ================= -->

<footer>

  <p>
    <a href="#">من نحن</a>
    |
    <a href="#">اتصل بنا</a>
  </p>

  <p>
    © 2026 Baro - جميع الحقوق محفوظة
  </p>

</footer>

<script>

const token = localStorage.getItem("token");
const merchantId = localStorage.getItem("merchantId");

if(!token || !merchantId){
  alert("الرجاء تسجيل الدخول أولاً");
  window.location = "login.html";
}

/* ================= MERCHANT ================= */

fetch(`https://order-platform-2.onrender.com/merchants/${merchantId}`,{
  headers:{
    "Authorization":`Bearer ${token}`
  }
})
.then(r=>r.json())
.then(merchant=>{

  document.getElementById("welcomeText").textContent =
    "مرحبًا، " + (merchant.name || "التاجر");

  /* مهم جدًا: صور cloudinary لا نضيف لها دومين */
  if(merchant.storeImage){
    document.getElementById("storeImg").src =
      merchant.storeImage;
  }

});

/* ================= PRODUCT ================= */

const params = new URLSearchParams(window.location.search);
const productId = params.get("productId");

if(!productId){
  alert("لا يوجد منتج");
  window.location = "dashboard.html";
}

let currentProduct = null;

fetch(`https://order-platform-2.onrender.com/merchants/${merchantId}/products/${productId}`,{
  headers:{
    "Authorization":`Bearer ${token}`
  }
})
.then(r=>r.json())
.then(data=>{

  const p = data.product || data;
  currentProduct = p;

  /* ===== صورة المنتج ===== */

  if(p.image){
    document.getElementById("productImage").src = p.image;
  }

  /* ===== VIEW MODE ===== */

  document.getElementById("v_name").textContent =
    p.name || "منتج";

  document.getElementById("v_category").textContent =
    p.category || "بدون تصنيف";

  document.getElementById("v_price").textContent =
    p.price || 0;

  document.getElementById("v_desc").textContent =
    p.description || "لا يوجد وصف";

  /* ===== FEATURES VIEW ===== */

  const vFeatures = document.getElementById("v_features");
  vFeatures.innerHTML = "";

  if(p.features && p.features.length){

    p.features.forEach(f=>{

      const div = document.createElement("div");
      div.className = "feature-card";

      div.innerHTML = `
        <h4>${f.name}</h4>

        <div class="feature-values">
          ${f.values.map(v=>`<span>${v}</span>`).join("")}
        </div>
      `;

      vFeatures.appendChild(div);

    });

  }else{

    vFeatures.innerHTML = `
      <p style="color:#777;">
        لا توجد ميزات لهذا المنتج
      </p>
    `;

  }

  /* ===== EDIT MODE ===== */

  document.getElementById("e_name").value =
    p.name || "";

  document.getElementById("e_category").value =
    p.category || "";

  document.getElementById("e_price").value =
    p.price || "";

  document.getElementById("e_desc").value =
    p.description || "";

  const eFeatures = document.getElementById("e_features");
  eFeatures.innerHTML = "";

  if(p.features && p.features.length){

    p.features.forEach(f=>{
      addFeatureField(
        f.name,
        f.values.join(", ")
      );
    });

  }

});

/* ================= EDIT ================= */

function enableEdit(){

  document.getElementById("viewMode").style.display = "none";
  document.getElementById("editMode").style.display = "block";

}

function disableEdit(){

  document.getElementById("editMode").style.display = "none";
  document.getElementById("viewMode").style.display = "block";

}

/* ================= FEATURES ================= */

function addFeatureField(name="", values=""){

  const container =
    document.getElementById("e_features");

  const div = document.createElement("div");

  div.className = "feature-row";

  div.innerHTML = `

    <div class="input-group">
      <label>اسم الميزة</label>

      <input class="f_name"
             value="${name}"
             placeholder="مثال: اللون">
    </div>

    <div class="input-group">
      <label>القيم</label>

      <input class="f_values"
             value="${values}"
             placeholder="أحمر, أزرق">
    </div>

    <button type="button"
            class="delete-feature"
            onclick="this.parentElement.remove()">

      🗑️ حذف الميزة

    </button>

  `;

  container.appendChild(div);

}

/* ================= SAVE ================= */

function saveChanges(){

  const featureRows =
    document.querySelectorAll(".feature-row");

  let features = [];

  featureRows.forEach(row=>{

    const name =
      row.querySelector(".f_name").value.trim();

    const values =
      row.querySelector(".f_values").value
      .split(",")
      .map(v=>v.trim())
      .filter(v=>v !== "");

    if(name && values.length > 0){

      features.push({
        name:name,
        values:values
      });

    }

  });

  const body = {

    name:
      document.getElementById("e_name").value,

    category:
      document.getElementById("e_category").value,

    price:
      Number(document.getElementById("e_price").value),

    description:
      document.getElementById("e_desc").value,

    /* مهم جدًا */
    features: features

  };

  fetch(`https://order-platform-2.onrender.com/merchants/${merchantId}/products/${productId}`,{

    method:"PUT",

    headers:{
      "Content-Type":"application/json",
      "Authorization":`Bearer ${token}`
    },

    body:JSON.stringify(body)

  })

  .then(async r=>{

    const data = await r.json();

    if(!r.ok){
      throw new Error(data.message || "فشل الحفظ");
    }

    return data;

  })

  .then(()=>{

    document.getElementById("status").style.color =
      "green";

    document.getElementById("status").textContent =
      "تم حفظ التعديلات بنجاح ✅";

    setTimeout(()=>{
      location.reload();
    },1200);

  })

  .catch(err=>{

    console.error(err);

    document.getElementById("status").style.color =
      "red";

    document.getElementById("status").textContent =
      "فشل حفظ التعديلات ❌";

  });

}

/* ================= NOTIFICATIONS ================= */

fetch(`https://order-platform-2.onrender.com/merchants/${merchantId}/notifications`,{
  headers:{
    "Authorization":`Bearer ${token}`
  }
})
.then(r=>r.json())
.then(notifs=>{

  const unread =
    notifs.filter(n=>!n.isRead).length;

  const badge =
    document.getElementById("notifBadge");

  if(unread > 0){

    badge.style.display = "flex";
    badge.textContent = unread;

  }

});

</script>

</body>
</html>
