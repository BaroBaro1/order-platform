<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عرض المنتج</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f4f9;
  direction:rtl;
  color:#222;
}

/* ===== NAVBAR ===== */

.navbar{
  background:white;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 30px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.right-side,
.left-side{
  display:flex;
  align-items:center;
  gap:12px;
}

.store-img{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #eee;
  background:white;
}

#welcomeText{
  font-weight:bold;
}

.logo{
  font-size:24px;
  font-weight:bold;
  color:#7c3aed;
}

.logout{
  text-decoration:none;
  color:#ff3366;
  font-weight:bold;
}

.notifications{
  text-decoration:none;
  font-size:20px;
}

.notification-wrapper{
  position:relative;
}

.badge{
  position:absolute;
  top:-5px;
  right:-5px;
  background:red;
  color:white;
  font-size:11px;
  width:18px;
  height:18px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ===== LAYOUT ===== */

.layout{
  display:flex;
}

/* ===== SIDEBAR ===== */

.sidebar{
  width:240px;
  background:white;
  min-height:100vh;
  padding-top:20px;
  border-left:1px solid #eee;
}

.sidebar a{
  display:block;
  padding:14px 20px;
  margin:6px 12px;
  border-radius:12px;
  text-decoration:none;
  color:#333;
  font-weight:600;
  transition:.2s;
}

.sidebar a:hover{
  background:#f3e8ff;
  color:#7c3aed;
}

/* ===== MAIN ===== */

.main{
  flex:1;
  padding:30px;
}

/* ===== PRODUCT CARD ===== */

.product-card{
  max-width:950px;
  margin:auto;
  background:white;
  border-radius:24px;
  padding:35px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  position:relative;
  overflow:hidden;
}

.product-card::before{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:100%;
  height:6px;
  background:linear-gradient(90deg,#7c3aed,#ff3366);
}

/* ===== PRODUCT HEADER ===== */

.product-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:30px;
  flex-wrap:wrap;
  margin-bottom:30px;
}

.product-info{
  flex:1;
  min-width:280px;
}

.product-title{
  font-size:34px;
  margin-bottom:12px;
  color:#222;
}

.product-category{
  color:#666;
  font-size:16px;
}

.price-badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:#f3e8ff;
  color:#7c3aed;
  padding:12px 20px;
  border-radius:14px;
  font-weight:bold;
  margin-top:18px;
  font-size:20px;
}

.product-img-wrapper{
  position:relative;
}

.product-img{
  width:320px;
  height:320px;
  object-fit:cover;
  border-radius:22px;
  background:white;
  border:1px solid #eee;
  box-shadow:0 12px 30px rgba(0,0,0,.08);
  transition:.3s;
}

.product-img:hover{
  transform:scale(1.02);
}

/* ===== SECTIONS ===== */

.product-section{
  background:#fafafa;
  border:1px solid #eee;
  padding:24px;
  border-radius:18px;
  margin-top:20px;
}

.product-section h3{
  margin-top:0;
  margin-bottom:16px;
  color:#7c3aed;
}

/* ===== FEATURES ===== */

.features-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
}

.feature-item{
  background:white;
  border:1px solid #eee;
  border-radius:16px;
  padding:16px;
  transition:.2s;
}

.feature-item:hover{
  transform:translateY(-2px);
  box-shadow:0 5px 15px rgba(0,0,0,.05);
}

.feature-item b{
  color:#7c3aed;
  display:block;
  margin-bottom:10px;
}

.feature-tag{
  display:inline-block;
  background:#f3e8ff;
  color:#7c3aed;
  padding:6px 12px;
  border-radius:30px;
  margin:4px;
  font-size:14px;
  font-weight:600;
}

/* ===== FORM ===== */

.form-group{
  margin-bottom:18px;
}

.form-group label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
}

input,
textarea{
  width:100%;
  padding:13px;
  border-radius:14px;
  border:1px solid #ddd;
  background:white;
  font-size:15px;
  transition:.2s;
}

input:focus,
textarea:focus{
  border-color:#7c3aed;
  outline:none;
  box-shadow:0 0 0 4px rgba(124,58,237,.1);
}

textarea{
  min-height:120px;
  resize:vertical;
}

/* ===== BUTTONS ===== */

.buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:25px;
}

button{
  border:none;
  padding:13px 18px;
  border-radius:14px;
  cursor:pointer;
  font-weight:bold;
  transition:.2s;
}

button:hover{
  transform:translateY(-1px);
  opacity:.95;
}

.edit-btn{
  background:linear-gradient(135deg,#7c3aed,#9333ea);
  color:white;
}

.save-btn{
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
}

.cancel-btn{
  background:#ef4444;
  color:white;
}

.add-feature-btn{
  background:#2563eb;
  color:white;
  margin-top:10px;
}

.delete-feature-btn{
  background:#ef4444;
  color:white;
  margin-top:10px;
}

/* ===== FEATURE EDIT ===== */

.feature-row{
  background:#fafafa;
  border:1px solid #eee;
  padding:16px;
  border-radius:16px;
  margin-top:14px;
}

/* ===== STATUS ===== */

#status{
  margin-top:20px;
  padding:15px;
  border-radius:14px;
  font-weight:bold;
  display:none;
}

.status-success{
  background:#dcfce7;
  color:#166534;
}

.status-error{
  background:#fee2e2;
  color:#991b1b;
}

/* ===== FOOTER ===== */

footer{
  background:#222;
  color:white;
  text-align:center;
  padding:20px;
  margin-top:40px;
}

footer a{
  color:#ffd000;
  text-decoration:none;
  margin:0 10px;
}

/* ===== MOBILE ===== */

@media(max-width:768px){

  .layout{
    flex-direction:column;
  }

  .sidebar{
    width:100%;
    min-height:auto;
    display:flex;
    overflow:auto;
    padding:10px;
  }

  .sidebar a{
    white-space:nowrap;
  }

  .product-header{
    flex-direction:column-reverse;
    align-items:center;
    text-align:center;
  }

  .product-img{
    width:100%;
    max-width:320px;
    height:auto;
  }

  .main{
    padding:15px;
  }

  .buttons{
    justify-content:center;
  }

}

</style>
</head>

<body>

<!-- ===== NAVBAR ===== -->

<div class="navbar">

  <div class="right-side">

    <img
      id="storeImg"
      src="https://via.placeholder.com/80"
      class="store-img"
    >

    <span id="welcomeText">
      مرحبًا، التاجر
    </span>

  </div>

  <div class="left-side">

    <div class="notification-wrapper">
      <a class="notifications" href="notifications.html">🔔</a>
      <span id="notifBadge" class="badge" style="display:none;">0</span>
    </div>

    <a class="logout" href="login.html">
      تسجيل الخروج
    </a>

 <div class="logo">
      <img src="https://res.cloudinary.com/dlwa29xss/image/upload/v1780516346/Baro_mfy4fo.png" width="40">
    </div>
  </div>

</div>

<div class="layout">

<!-- ===== SIDEBAR ===== -->

<div class="sidebar">

  <a href="dashboard.html">🏠 لوحة التحكم</a>

  <a href="allorders.html">🛒 الطلبات</a>

  <a href="settings.html">⚙️ الإعدادات</a>

  <a href="addProduct.html">➕ إضافة منتج</a>

</div>

<!-- ===== MAIN ===== -->

<div class="main">

<div class="product-card">

<!-- ===== HEADER ===== -->

<div class="product-header">

  <div class="product-info">

    <h1 id="v_name" class="product-title"></h1>

    <p class="product-category">
      📦 <b>الصنف:</b>
      <span id="v_category"></span>
    </p>

    <div class="price-badge">
      💰 <span id="v_price"></span> دج
    </div>

    <div class="buttons">

      <button
        id="editBtn"
        class="edit-btn"
        onclick="enableEdit()"
      >
        ✏️ تعديل المنتج
      </button>

    </div>

  </div>

  <div class="product-img-wrapper">

    <img
      id="productImage"
      src=""
      class="product-img"
    >

  </div>

</div>

<!-- ===== VIEW MODE ===== -->

<div id="viewMode">

  <div class="product-section">

    <h3>📝 وصف المنتج</h3>

    <p id="v_desc"></p>

  </div>

  <div class="product-section">

    <h3>✨ الميزات</h3>

    <div
      id="v_features"
      class="features-grid"
    ></div>

  </div>

</div>

<!-- ===== EDIT MODE ===== -->

<div id="editMode" style="display:none;">

  <div class="product-section">

    <div class="form-group">

      <label>اسم المنتج</label>

      <input id="e_name">

    </div>

    <div class="form-group">

      <label>الصنف</label>

      <input id="e_category">

    </div>

    <div class="form-group">

      <label>السعر</label>

      <input id="e_price">

    </div>

    <div class="form-group">

      <label>الوصف</label>

      <textarea id="e_desc"></textarea>

    </div>

  </div>

  <div class="product-section">

    <h3>✨ الميزات</h3>

    <div id="e_features"></div>

    <button
      type="button"
      class="add-feature-btn"
      onclick="addFeatureField()"
    >
      ➕ إضافة ميزة
    </button>

  </div>

  <div class="buttons">

    <button
      class="save-btn"
      onclick="saveChanges()"
    >
      💾 حفظ التغييرات
    </button>

    <button
      type="button"
      class="cancel-btn"
      onclick="disableEdit()"
    >
      ❌ إلغاء
    </button>

  </div>

</div>

<p id="status"></p>

</div>

</div>

</div>

<footer>
  <p>© 2026 Baro - جميع الحقوق محفوظة</p>
</footer>

<script>

/* ===== AUTH ===== */

const token = localStorage.getItem("token");
const merchantId = localStorage.getItem("merchantId");

if(!token || !merchantId){

  alert("الرجاء تسجيل الدخول أولاً");

  window.location = "login.html";

}

/* ===== PRODUCT ID ===== */

const params = new URLSearchParams(window.location.search);

const productId = params.get("productId");

if(!productId){

  alert("لا يوجد منتج");

  window.location = "dashboard.html";

}

/* ===== IMAGE FIX ===== */

function getImageUrl(path){

  if(!path || path === "null"){

    return "https://via.placeholder.com/300?text=No+Image";

  }

  // Cloudinary
  if(path.startsWith("http")){

    return path;

  }

  // Local uploads
  return "https://order-platform-2.onrender.com" +
    (path.startsWith("/") ? path : "/" + path);

}

/* ===== MERCHANT DATA ===== */

fetch(`https://order-platform-2.onrender.com/merchants/${merchantId}`,{

  headers:{
    "Authorization":`Bearer ${token}`
  }

})

.then(r=>r.json())

.then(merchant=>{

  document.getElementById("welcomeText").textContent =
    "مرحبًا، " + (merchant.name || "التاجر");

  document.getElementById("storeImg").src =
    getImageUrl(merchant.storeImage);

})

.catch(err=>{

  console.log(err);

});

/* ===== EDIT MODE ===== */

function enableEdit(){

  document.getElementById("viewMode").style.display = "none";

  document.getElementById("editMode").style.display = "block";

}

function disableEdit(){

  document.getElementById("viewMode").style.display = "block";

  document.getElementById("editMode").style.display = "none";

}

/* ===== LOAD PRODUCT ===== */

fetch(`https://order-platform-2.onrender.com/merchants/${merchantId}/products/${productId}`,{

  headers:{
    "Authorization":`Bearer ${token}`
  }

})

.then(r=>r.json())

.then(data=>{

  const p = data.product || data;

  /* ===== IMAGE ===== */

  document.getElementById("productImage").src =
    getImageUrl(p.image);

  /* ===== VIEW ===== */

  document.getElementById("v_name").textContent =
    p.name || "";

  document.getElementById("v_category").textContent =
    p.category || "—";

  document.getElementById("v_price").textContent =
    p.price || 0;

  document.getElementById("v_desc").textContent =
    p.description || "لا يوجد وصف";

  /* ===== EDIT ===== */

  document.getElementById("e_name").value =
    p.name || "";

  document.getElementById("e_category").value =
    p.category || "";

  document.getElementById("e_price").value =
    p.price || "";

  document.getElementById("e_desc").value =
    p.description || "";

  /* ===== FEATURES VIEW ===== */

  const vF = document.getElementById("v_features");

  vF.innerHTML = "";

  if(!p.features || p.features.length === 0){

    vF.innerHTML = `
      <p>لا توجد ميزات لهذا المنتج</p>
    `;

  }else{

    p.features.forEach(f=>{

      vF.innerHTML += `

        <div class="feature-item">

          <b>${f.name}</b>

          <div>

            ${f.values.map(v=>`

              <span class="feature-tag">
                ${v}
              </span>

            `).join("")}

          </div>

        </div>

      `;

    });

  }

  /* ===== FEATURES EDIT ===== */

  const eF = document.getElementById("e_features");

  eF.innerHTML = "";

  (p.features || []).forEach(f=>{

    addFeatureField(
      f.name,
      f.values.join(", ")
    );

  });

})

.catch(err=>{

  console.log(err);

});

/* ===== ADD FEATURE ===== */

function addFeatureField(name="", values=""){

  const container =
    document.getElementById("e_features");

  const div = document.createElement("div");

  div.className = "feature-row";

  div.innerHTML = `

    <input
      class="f_name"
      placeholder="اسم الميزة"
      value="${name}"
    >

    <input
      class="f_values"
      placeholder="القيم مفصولة بفاصلة"
      value="${values}"
    >

    <button
      type="button"
      class="delete-feature-btn"
      onclick="this.parentElement.remove()"
    >
      🗑️ حذف
    </button>

  `;

  container.appendChild(div);

}

/* ===== SAVE ===== */

function saveChanges(){

  const featureRows =
    document.querySelectorAll(".feature-row");

  let features = [];

  featureRows.forEach(row=>{

    const name =
      row.querySelector(".f_name").value.trim();

    const values =
      row.querySelector(".f_values").value
      .split(",")
      .map(v=>v.trim())
      .filter(v=>v !== "");

    if(name && values.length > 0){

      features.push({
        name:name,
        values:values
      });

    }

  });

  const body = {

    name:
      document.getElementById("e_name").value,

    category:
      document.getElementById("e_category").value,

    price:
      document.getElementById("e_price").value,

    description:
      document.getElementById("e_desc").value,

    features:features

  };

  fetch(`https://order-platform-2.onrender.com/merchants/${merchantId}/products/${productId}`,{

    method:"PUT",

    headers:{
      "Content-Type":"application/json",
      "Authorization":`Bearer ${token}`
    },

    body:JSON.stringify(body)

  })

  .then(r=>r.json())

  .then(data=>{

    const status =
      document.getElementById("status");

    status.style.display = "block";

    status.className = "status-success";

    status.textContent =
      "✅ تم حفظ التعديلات بنجاح";

    setTimeout(()=>{

      location.reload();

    },1000);

  })

  .catch(err=>{

    console.log(err);

    const status =
      document.getElementById("status");

    status.style.display = "block";

    status.className = "status-error";

    status.textContent =
      "❌ حدث خطأ أثناء الحفظ";

  });

}

/* ===== NOTIFICATIONS ===== */

fetch(`https://order-platform-2.onrender.com/merchants/${merchantId}/notifications`,{

  headers:{
    "Authorization":`Bearer ${token}`
  }

})

.then(r=>r.json())

.then(notifs=>{

  const unread =
    notifs.filter(n=>!n.isRead).length;

  const badge =
    document.getElementById("notifBadge");

  if(unread > 0){

    badge.style.display = "flex";

    badge.textContent = unread;

  }

})

.catch(err=>{

  console.log(err);

});

</script>

</body>
</html>
