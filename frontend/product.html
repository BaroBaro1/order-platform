<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عرض المنتج</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  background:#f5f3ff;
  direction:rtl;
  color:#222;
}

/* ================= HEADER ================= */

.navbar{
  background:white;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 30px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
  position:sticky;
  top:0;
  z-index:999;
}

.right-side,
.left-side{
  display:flex;
  align-items:center;
  gap:14px;
}

.store-img{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #eee;
}

#welcomeText{
  font-weight:bold;
}

.logo{
  font-size:24px;
  font-weight:bold;
  color:#ff3366;
}

.notifications{
  text-decoration:none;
  font-size:20px;
  position:relative;
}

.notification-wrapper{
  position:relative;
}

.badge{
  position:absolute;
  top:-6px;
  right:-6px;
  background:#ff3366;
  color:white;
  width:18px;
  height:18px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:bold;
}

.logout{
  color:#ff3366;
  text-decoration:none;
  font-weight:bold;
}

/* ================= LAYOUT ================= */

.layout{
  display:flex;
}

/* ================= SIDEBAR ================= */

.sidebar{
  width:240px;
  background:white;
  min-height:100vh;
  padding:20px 14px;
  border-left:1px solid #eee;
}

.sidebar a{
  display:flex;
  align-items:center;
  gap:10px;
  text-decoration:none;
  color:#444;
  padding:14px;
  border-radius:12px;
  margin-bottom:8px;
  transition:.3s;
  font-weight:bold;
}

.sidebar a:hover{
  background:#f3e8ff;
  color:#7c3aed;
}

.sidebar a.active{
  background:linear-gradient(135deg,#8b5cf6,#7c3aed);
  color:white;
}

/* ================= MAIN ================= */

.main{
  flex:1;
  padding:30px;
}

/* ================= BREADCRUMB ================= */

.breadcrumb{
  color:#777;
  margin-bottom:20px;
  font-size:14px;
}

/* ================= PRODUCT HEADER ================= */

.product-hero{
  background:white;
  border-radius:22px;
  padding:25px;
  display:flex;
  gap:25px;
  align-items:center;
  box-shadow:0 5px 20px rgba(124,58,237,.08);
  margin-bottom:25px;
  flex-wrap:wrap;
}

.product-img{
  width:260px;
  height:260px;
  border-radius:20px;
  object-fit:cover;
  background:#f3f3f3;
  transition:.3s;
}

.product-img:hover{
  transform:scale(1.03);
}

.product-info{
  flex:1;
}

.product-badge{
  display:inline-block;
  background:#ede9fe;
  color:#7c3aed;
  padding:8px 14px;
  border-radius:30px;
  font-size:13px;
  font-weight:bold;
  margin-bottom:15px;
}

.product-title{
  font-size:32px;
  margin-bottom:15px;
}

.product-price{
  font-size:28px;
  color:#ff3366;
  font-weight:bold;
  margin-bottom:18px;
}

.quick-meta{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}

.meta-box{
  background:#faf5ff;
  padding:12px 18px;
  border-radius:14px;
  font-size:14px;
  color:#555;
}

/* ================= ACTIONS ================= */

.actions-bar{
  background:white;
  padding:18px;
  border-radius:18px;
  margin-bottom:25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 3px 12px rgba(0,0,0,.05);
  position:sticky;
  top:85px;
  z-index:50;
  flex-wrap:wrap;
  gap:12px;
}

.action-buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

button{
  border:none;
  border-radius:12px;
  padding:12px 18px;
  cursor:pointer;
  font-weight:bold;
  transition:.3s;
}

button:hover{
  transform:translateY(-2px);
}

.edit-btn{
  background:#7c3aed;
  color:white;
}

.save-btn{
  background:#22c55e;
  color:white;
}

.cancel-btn{
  background:#ef4444;
  color:white;
}

.copy-btn{
  background:#ff3366;
  color:white;
}

/* ================= CARDS ================= */

.card{
  background:white;
  padding:25px;
  border-radius:20px;
  box-shadow:0 5px 15px rgba(0,0,0,.05);
  margin-bottom:20px;
}

.card h3{
  margin-bottom:20px;
  color:#7c3aed;
}

/* ================= DESCRIPTION ================= */

.description{
  line-height:1.8;
  color:#555;
}

/* ================= FEATURES ================= */

.features-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.feature-card{
  background:#faf5ff;
  padding:16px;
  border-radius:16px;
}

.feature-card strong{
  display:block;
  margin-bottom:10px;
  color:#7c3aed;
}

.feature-values{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.feature-tag{
  background:white;
  border:1px solid #ddd;
  padding:6px 10px;
  border-radius:30px;
  font-size:13px;
}

/* ================= EDIT MODE ================= */

.input-group{
  margin-bottom:18px;
}

.input-group label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
}

input,
textarea{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:1px solid #ddd;
  background:#fafafa;
  transition:.3s;
}

input:focus,
textarea:focus{
  outline:none;
  border-color:#8b5cf6;
  background:white;
}

textarea{
  min-height:120px;
  resize:vertical;
}

/* ================= FEATURE ROW ================= */

.feature-row{
  background:#faf5ff;
  padding:15px;
  border-radius:14px;
  margin-bottom:12px;
}

.remove-btn{
  background:#ef4444;
  color:white;
  margin-top:10px;
}

.add-feature-btn{
  background:#7c3aed;
  color:white;
  width:100%;
  margin-top:10px;
}

/* ================= STATUS ================= */

#status{
  margin-top:15px;
  font-weight:bold;
  color:#22c55e;
}

/* ================= FOOTER ================= */

footer{
  background:#222;
  color:white;
  text-align:center;
  padding:20px;
  margin-top:40px;
}

footer a{
  color:#ffd000;
  text-decoration:none;
  margin:0 10px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:900px){

  .layout{
    flex-direction:column;
  }

  .sidebar{
    width:100%;
    min-height:auto;
    display:flex;
    overflow:auto;
    gap:10px;
  }

  .sidebar a{
    white-space:nowrap;
    margin-bottom:0;
  }

  .product-hero{
    flex-direction:column;
    text-align:center;
  }

  .product-img{
    width:100%;
    max-width:320px;
    height:auto;
  }

  .actions-bar{
    flex-direction:column;
    align-items:stretch;
  }

  .action-buttons{
    width:100%;
  }

  .action-buttons button{
    flex:1;
  }
}
</style>
</head>

<body>

<!-- HEADER -->

<div class="navbar">

  <div class="right-side">
    <img id="storeImg" src="https://via.placeholder.com/45" class="store-img">
    <span id="welcomeText">مرحبًا، التاجر</span>
  </div>

  <div class="left-side">

    <div class="notification-wrapper">
      <a class="notifications" href="notifications.html">🔔</a>
      <span id="notifBadge" class="badge" style="display:none;">0</span>
    </div>

    <a class="logout" href="login.html">تسجيل الخروج</a>

    <div class="logo">Baro</div>

  </div>

</div>

<div class="layout">

  <!-- SIDEBAR -->

  <div class="sidebar">
    <a href="dashboard.html">🏠 لوحة التحكم</a>
    <a href="allorders.html">🛒 الطلبات</a>
    <a href="settings.html">⚙️ الإعدادات</a>
    <a href="addProduct.html" class="active">📦 المنتج</a>
  </div>

  <!-- MAIN -->

  <div class="main">

    

    <!-- PRODUCT HERO -->

    <div class="product-hero">

      <img id="productImage" src="" class="product-img">

      <div class="product-info">

        <div class="product-badge" id="v_category">
          منتج
        </div>

        <h1 class="product-title" id="v_name"></h1>

        <div class="product-price">
          <span id="v_price"></span> دج
        </div>

        <div class="quick-meta">

          <div class="meta-box">
            رقم المنتج:
            <span id="productIdBox"></span>
          </div>

          <div class="meta-box">
            عدد الميزات:
            <span id="featuresCount"></span>
          </div>

        </div>

      </div>

    </div>

    <!-- ACTIONS -->

    <div class="actions-bar">

      <strong>إدارة المنتج</strong>

      <div class="action-buttons">

        <button class="copy-btn" onclick="copyProductLink()">
          🔗 نسخ رابط الطلب
        </button>

        <button class="edit-btn" id="editBtn" onclick="enableEdit()">
          ✏️ تعديل
        </button>

        <button class="save-btn" id="saveBtn" onclick="saveChanges()" style="display:none;">
          💾 حفظ
        </button>

        <button class="cancel-btn" id="cancelBtn" onclick="disableEdit()" style="display:none;">
          ❌ إلغاء
        </button>

      </div>

    </div>

    <!-- VIEW MODE -->

    <div id="viewMode">

      <div class="card">
        <h3>📝 وصف المنتج</h3>

        <div class="description" id="v_desc"></div>
      </div>

      <div class="card">
        <h3>✨ الميزات</h3>

        <div class="features-grid" id="v_features"></div>
      </div>

    </div>

    <!-- EDIT MODE -->

    <div id="editMode" style="display:none;">

      <div class="card">

        <h3>✏️ تعديل المنتج</h3>

        <div class="input-group">
          <label>اسم المنتج</label>
          <input id="e_name">
        </div>

        <div class="input-group">
          <label>الصنف</label>
          <input id="e_category">
        </div>

        <div class="input-group">
          <label>السعر</label>
          <input id="e_price">
        </div>

        <div class="input-group">
          <label>الوصف</label>
          <textarea id="e_desc"></textarea>
        </div>

      </div>

      <div class="card">

        <h3>⚡ الميزات</h3>

        <div id="e_features"></div>

        <button class="add-feature-btn" onclick="addFeatureField()">
          ➕ إضافة ميزة
        </button>

      </div>

    </div>

    <p id="status"></p>

  </div>

</div>

<footer>
  <p>
    <a href="#">من نحن</a> |
    <a href="#">اتصل بنا</a>
  </p>

  <p>© 2026 Baro - جميع الحقوق محفوظة</p>
</footer>

<script>

const token = localStorage.getItem("token");
const merchantId = localStorage.getItem("merchantId");

if(!token || !merchantId){
  alert("الرجاء تسجيل الدخول أولاً");
  window.location = "login.html";
}

/* ================= PRODUCT ID ================= */

const params = new URLSearchParams(window.location.search);
const productId = params.get("productId");

if(!productId){
  alert("لا يوجد معرف منتج");
  window.location = "dashboard.html";
}

document.getElementById("productIdBox").textContent = productId;

/* ================= MERCHANT ================= */

fetch(`https://order-platform-2.onrender.com/merchants/${merchantId}`,{
  headers:{
    "Authorization":`Bearer ${token}`,
    "Content-Type":"application/json"
  }
})
.then(r=>r.json())
.then(merchant=>{

  document.getElementById("welcomeText").textContent =
    "مرحبًا، " + (merchant.name || "التاجر");

  if(merchant.storeImage){
    document.getElementById("storeImg").src =
      "https://order-platform-2.onrender.com" + merchant.storeImage;
  }

});

/* ================= LOAD PRODUCT ================= */

fetch(`https://order-platform-2.onrender.com/merchants/${merchantId}/products/${productId}`,{
  headers:{
    "Authorization":`Bearer ${token}`
  }
})
.then(r=>r.json())
.then(data=>{

  const p = data.product || data;

  document.getElementById("productImage").src =
    "https://order-platform-2.onrender.com" + (p.image || "");

  document.getElementById("v_name").textContent = p.name;
  document.getElementById("v_category").textContent = p.category || "منتج";
  document.getElementById("v_price").textContent = p.price;
  document.getElementById("v_desc").textContent =
    p.description || "لا يوجد وصف.";

  document.getElementById("featuresCount").textContent =
    (p.features || []).length;

  /* VIEW FEATURES */

  const vF = document.getElementById("v_features");
  vF.innerHTML = "";

  if((p.features || []).length === 0){

    vF.innerHTML = `
      <div class="feature-card">
        لا توجد ميزات مضافة بعد
      </div>
    `;

  }else{

    (p.features || []).forEach(f=>{

      let valuesHTML = "";

      f.values.forEach(v=>{
        valuesHTML += `
          <div class="feature-tag">${v}</div>
        `;
      });

      vF.innerHTML += `
        <div class="feature-card">

          <strong>${f.name}</strong>

          <div class="feature-values">
            ${valuesHTML}
          </div>

        </div>
      `;

    });

  }

  /* EDIT */

  document.getElementById("e_name").value = p.name;
  document.getElementById("e_category").value = p.category || "";
  document.getElementById("e_price").value = p.price;
  document.getElementById("e_desc").value = p.description || "";

  const eF = document.getElementById("e_features");
  eF.innerHTML = "";

  (p.features || []).forEach(f=>{
    addFeatureField(f.name, f.values.join(", "));
  });

});

/* ================= EDIT MODE ================= */

function enableEdit(){

  document.getElementById("viewMode").style.display = "none";
  document.getElementById("editMode").style.display = "block";

  document.getElementById("editBtn").style.display = "none";
  document.getElementById("saveBtn").style.display = "inline-block";
  document.getElementById("cancelBtn").style.display = "inline-block";

}

function disableEdit(){

  document.getElementById("viewMode").style.display = "block";
  document.getElementById("editMode").style.display = "none";

  document.getElementById("editBtn").style.display = "inline-block";
  document.getElementById("saveBtn").style.display = "none";
  document.getElementById("cancelBtn").style.display = "none";

}

/* ================= FEATURES ================= */

function addFeatureField(name = "", values = ""){

  const container = document.getElementById("e_features");

  const div = document.createElement("div");

  div.className = "feature-row";

  div.innerHTML = `

    <div class="input-group">
      <label>اسم الميزة</label>
      <input class="f_name" value="${name}">
    </div>

    <div class="input-group">
      <label>القيم</label>
      <input class="f_values" value="${values}">
    </div>

    <button class="remove-btn" type="button"
      onclick="this.parentElement.remove()">
      🗑️ حذف
    </button>

  `;

  container.appendChild(div);

}

/* ================= SAVE ================= */

function saveChanges(){

  const featureRows = document.querySelectorAll(".feature-row");

  let features = [];

  featureRows.forEach(row=>{

    const name = row.querySelector(".f_name").value.trim();

    const values = row.querySelector(".f_values").value
      .split(",")
      .map(v=>v.trim())
      .filter(v=>v !== "");

    if(name && values.length > 0){
      features.push({name, values});
    }

  });

  const body = {

    name: document.getElementById("e_name").value,
    category: document.getElementById("e_category").value,
    price: document.getElementById("e_price").value,
    description: document.getElementById("e_desc").value,
    features: features

  };

  fetch(`https://order-platform-2.onrender.com/merchants/${merchantId}/products/${productId}`,{

    method:"PUT",

    headers:{
      "Content-Type":"application/json",
      "Authorization":`Bearer ${token}`
    },

    body:JSON.stringify(body)

  })
  .then(async r => {
  const data = await r.json();
  console.log("UPDATE RESPONSE:", data);

  if(!r.ok){
    throw new Error(data.error || "فشل التحديث");
  }

  alert("تم حفظ التعديلات ✅");
  location.reload();
})
.catch(err=>{
  console.error(err);
  alert("حدث خطأ أثناء حفظ الميزات");
});

}

/* ================= COPY PRODUCT LINK ================= */

function copyProductLink(){

  const link =
  `https://order-platform-rs51.vercel.app/order.html?productId=${productId}`;

  navigator.clipboard.writeText(link);

  document.getElementById("status").textContent =
    "تم نسخ الرابط بنجاح ✅";

}

/* ================= NOTIFICATIONS ================= */

fetch(`https://order-platform-2.onrender.com/merchants/${merchantId}/notifications`,{
  headers:{
    "Authorization":`Bearer ${token}`
  }
})
.then(r=>r.json())
.then(notifs=>{

  const unread = notifs.filter(n=>!n.isRead).length;

  const badge = document.getElementById("notifBadge");

  if(unread > 0){

    badge.style.display = "flex";
    badge.textContent = unread;

  }else{

    badge.style.display = "none";

  }

});

</script>

</body>
</html>
